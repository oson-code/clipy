[package]
name = "clipy"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Clipboard extension app for Linux, a port of Clipy for macOS"
authors = ["imirsaburov <imirsaburov@gmail.com>"]
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
arboard = { version = "3.7", features = ["wayland-data-control"] }
base64 = "0.22"
blake3 = "1"
directories = "6"
env_logger = "0.11"
futures-channel = "0.3"
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
lexopt = "0.3"
log = "0.4"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
thiserror = "2"
toml = "1"
tray-icon = "0.26"
x11rb = { version = "0.13", features = ["xfixes", "xkb", "xtest"] }
zbus = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
